<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测身高</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --primary:#5b6ef5;--primary-light:#eef0fe;--primary-dark:#4451d6;
    --bg:#f4f5f7;--card-bg:#fff;
    --text:#2d3436;--text-light:#636e72;--text-lighter:#b2bec3;
    --border:#e9ecf0;--danger:#e74c3c;--success:#00b894;
    --shadow:0 2px 8px rgba(0,0,0,.06);--shadow-hover:0 4px 16px rgba(0,0,0,.1);
    --radius:10px;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;
  }
  .header{background:var(--card-bg);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .header h1{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
  .header .sub{font-size:12px;color:var(--text-light)}
  .header .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .content{max-width:760px;margin:0 auto;padding:22px 20px 48px}
  /* ===== Buttons ===== */
  .btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px;font-family:inherit;touch-action:manipulation}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-outline{background:var(--card-bg);color:var(--text-light);border:1px solid var(--border)}
  .btn-outline:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}
  /* ===== 区块 ===== */
  .height-sec{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
  .height-sec h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .height-sec h3 .h-sub{font-weight:400;font-size:12px;color:var(--text-lighter)}
  .height-code-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .height-code-row input{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;letter-spacing:1px;font-family:inherit}
  .height-code-row input:focus{outline:none;border-color:var(--primary)}
  .hlink-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-top:14px}
  .hlink{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;background:var(--card-bg);text-align:left;font-family:inherit}
  .hlink:hover{border-color:var(--primary);box-shadow:var(--shadow-hover);transform:translateY(-1px)}
  .hlink .t{font-weight:600;font-size:14px;color:var(--primary)}
  .hlink .d{font-size:12px;color:var(--text-light);line-height:1.5}
  .height-tips{font-size:12.5px;color:var(--text-light);line-height:1.9;margin-top:12px;background:var(--primary-light);border-radius:8px;padding:10px 14px}
  .height-table{width:100%;border-collapse:collapse;font-size:13px}
  .height-table th,.height-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
  .height-table th{color:var(--text-light);font-weight:600;font-size:12px}
  .height-table td:first-child{font-weight:700;white-space:nowrap}
  /* ===== 档案卡片 ===== */
  .record-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;transition:box-shadow .2s}
  .record-card:hover{box-shadow:var(--shadow)}
  .record-card .rname{font-weight:700;font-size:15px;margin-right:4px}
  .h-badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
  .h-badge.cur{background:var(--primary-light);color:var(--primary)}
  .h-badge.max{background:#e8f7ef;color:#00875a}
  .h-badge.min{background:#fdf0e7;color:#c96a1f}
  .record-card .rdate{font-size:12px;color:var(--text-lighter);margin-left:auto;white-space:nowrap}
  .record-card .rcode{font-size:12px;color:var(--text-light);cursor:pointer}
  .record-card .rcode:hover{color:var(--primary)}
  .record-card .rnote{font-size:12.5px;color:var(--text-light);line-height:1.6}
  .record-actions{display:flex;gap:4px}
  .record-actions button{background:none;border:none;cursor:pointer;color:var(--text-lighter);font-size:14px;padding:4px 6px;border-radius:6px;transition:color .15s;font-family:inherit;touch-action:manipulation}
  .record-actions button:hover{color:var(--primary)}
  .record-actions .rd:hover{color:var(--danger)}
  .empty{padding:28px 20px;text-align:center;color:var(--text-lighter)}
  .empty .ei{font-size:34px;margin-bottom:6px}
  .empty p{color:var(--text-light)}
  /* ===== Modal ===== */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:16px}
  .modal-overlay.show{display:flex}
  .modal{background:#fff;border-radius:14px;padding:24px;width:400px;max-width:100%;max-height:88vh;overflow-y:auto;animation:slideUp .2s ease}
  .modal h3{font-size:16px;margin-bottom:16px}
  .modal .field{margin-bottom:12px}
  .modal label{display:block;font-size:12.5px;font-weight:600;color:var(--text-light);margin-bottom:6px}
  .modal input,.modal select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit}
  .modal input:focus,.modal select:focus{outline:none;border-color:var(--primary)}
  .modal-hint{font-size:11.5px;color:var(--text-lighter);margin-top:4px;line-height:1.5}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  /* ===== Toast & Confirm ===== */
  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  /* ===== Mobile ===== */
  @media(max-width:768px){
    .header{padding:12px 14px}
    .header h1{font-size:17px}
    .content{padding:14px 12px 40px}
    .hlink-grid{grid-template-columns:1fr 1fr}
    .hlink{padding:10px 12px}
    .hlink .d{font-size:11px}
    .record-card .rdate{margin-left:0;width:100%;text-align:right}
    .record-card .rcode{padding:4px 0}
    .modal{width:94vw;padding:20px}
    .modal input,.modal select{font-size:16px}
  }
  @media(max-width:420px){
    .hlink-grid{grid-template-columns:1fr}
    .header .actions .btn{padding:6px 10px;font-size:12px}
  }
</style>
</head>
<body>
  <div class="header">
    <h1>📏 测身高</h1>
    <div class="sub">好友码查询 · 身高档案 · 对照表</div>
    <div class="actions">
      <button class="btn btn-primary" onclick="openHeightModal(-1)">＋ 新建档案</button>
      <button class="btn btn-outline" onclick="exportData()" title="导出档案备份">📤 导出</button>
      <button class="btn btn-outline" onclick="importData()" title="导入档案备份">📥 导入</button>
    </div>
  </div>
  <div class="content" id="content"></div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast"></div>
  <input type="file" id="import-file" accept=".json" style="display:none">

<script>
/* ============================================================
   测身高工作台（独立应用）
   存储键沿用 wenzan-height-v1，从文案整理拆出时数据自动继承
============================================================ */
const HEIGHT_STORAGE_KEY = 'wenzan-height-v1';
let heightRecords = [];
let heightCode = '';

function loadHeightData() {
  try {
    var d = JSON.parse(localStorage.getItem(HEIGHT_STORAGE_KEY) || '{}');
    heightRecords = Array.isArray(d.records) ? d.records : [];
    heightCode = d.code || '';
  } catch(e) { heightRecords = []; heightCode = ''; }
}

function saveHeightData() {
  try { localStorage.setItem(HEIGHT_STORAGE_KEY, JSON.stringify({ records: heightRecords, code: heightCode })); } catch(e) {}
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function() { showToast('✅ 已复制'); }).catch(function() { fallbackCopy(t); });
  } else {
    fallbackCopy(t);
  }
}

function fallbackCopy(t) {
  var ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('✅ 已复制'); } catch(e) { showToast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

function copyHeightCode() {
  var v = document.getElementById('height-code').value.trim();
  if (!v) { showToast('请先输入好友码'); return; }
  copyText(v);
}

/* ===== 号数 → 类型标签 ===== */
function heightTagLabel(n) {
  n = parseInt(n, 10);
  if (isNaN(n)) return '';
  if (n === 0) return '永高';
  if (n === 1) return '伪永高';
  if (n >= 2 && n <= 7) return '中等';
  if (n >= 8 && n <= 13) return '小个子';
  if (n === 14) return '永矮';
  return '';
}

/* ===== 渲染 ===== */
function render() {
  var content = document.getElementById('content');
  var html = '';

  // 1) 好友码快速查询
  html += '<div class="height-sec"><h3>🔍 快速查询</h3>' +
    '<div class="height-code-row">' +
    '<input type="text" id="height-code" placeholder="输入好友码，如 1234-5678" value="' + escapeHtml(heightCode) + '" maxlength="9" inputmode="numeric">' +
    '<button class="btn btn-outline" onclick="copyHeightCode()">📋 复制好友码</button>' +
    '</div>' +
    '<div class="hlink-grid">' +
    '<button class="hlink" onclick="window.open(\'https://sky.t1qq.com/\',\'_blank\')"><span class="t">sky.t1qq.com</span><span class="d">好友码查询 · 每人免费1次，之后需点数</span></button>' +
    '<button class="hlink" onclick="window.open(\'https://sky.1iic.cn/\',\'_blank\')"><span class="t">sky.1iic.cn</span><span class="d">好友码查询 · 支持国服 iOS / 安卓</span></button>' +
    '<button class="hlink" onclick="window.open(\'https://skyforus.cn/\',\'_blank\')"><span class="t">skyforus.cn</span><span class="d">好友码查询 + 全服身高数据统计</span></button>' +
    '<button class="hlink" onclick="window.open(\'https://dream10325.github.io/sky-cotl-height-tool/\',\'_blank\')"><span class="t">QR码身高工具</span><span class="d">免费 · 造型二维码截图本地计算，仅供参考</span></button>' +
    '</div>' +
    '<div class="height-tips">📌 好友码获取：游戏右上角 设置 → 好友 → 使用编号。好友码方式由测量员加好友实测（一号一码），查询完成后请勿拉黑测量员；QR码工具需用 设置 → 帐号 → 造型 QR code 的截图（⚠️ 不是加好友的二维码），本地计算完全免费，结果仅供参考。</div>' +
    '</div>';

  // 2) 身高档案
  html += '<div class="height-sec"><h3>📖 身高档案 <span class="h-sub">记录每次查询结果，重塑后可对比变化</span></h3>';
  if (heightRecords.length === 0) {
    html += '<div class="empty"><div class="ei">📏</div><p>暂无身高档案</p><p style="margin-top:4px;font-size:13px">点击右上角「新建档案」记录查询结果</p></div>';
  } else {
    heightRecords.forEach(function(r, i) {
      var curTag = (r.cur !== '' && r.cur !== undefined) ? '当前 ' + r.cur + '号' + (heightTagLabel(r.cur) ? ' · ' + heightTagLabel(r.cur) : '') : '';
      var maxTag = (r.max !== '' && r.max !== undefined) ? '最高 ' + r.max + '号' + (heightTagLabel(r.max) ? ' · ' + heightTagLabel(r.max) : '') : '';
      var minTag = (r.min !== '' && r.min !== undefined) ? '最矮 ' + r.min + '号' + (heightTagLabel(r.min) ? ' · ' + heightTagLabel(r.min) : '') : '';
      html += '<div class="record-card">' +
        '<span class="rname">' + escapeHtml(r.name) + '</span>' +
        (curTag ? '<span class="h-badge cur">' + curTag + '</span>' : '') +
        (maxTag ? '<span class="h-badge max">' + maxTag + '</span>' : '') +
        (minTag ? '<span class="h-badge min">' + minTag + '</span>' : '') +
        '<div class="record-actions">' +
        '<button title="编辑档案" onclick="openHeightModal(' + i + ')">✎</button>' +
        '<button class="rd" title="删除档案" onclick="deleteHeightRecord(' + i + ')">🗑</button>' +
        '</div>' +
        '<span class="rdate">' + escapeHtml(r.date || '') + '</span>' +
        '<div style="width:100%;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center">' +
        (r.code ? '<span class="rcode" onclick="copyText(\'' + escapeHtml(r.code) + '\')" title="点击复制好友码">好友码 ' + escapeHtml(r.code) + '</span>' : '') +
        (r.note ? '<span class="rnote">' + escapeHtml(r.note) + '</span>' : '') +
        '</div>' +
        '</div>';
    });
  }
  html += '</div>';

  // 3) 身高对照表
  html += '<div class="height-sec"><h3>📐 身高对照表（0~14号）</h3>' +
    '<table class="height-table">' +
    '<tr><th>号数</th><th>类型</th><th>说明</th></tr>' +
    '<tr><td>0号</td><td>永高</td><td>全游戏最高，仅创号极小概率（不到0.1%）产出，重塑魔法刷不出</td></tr>' +
    '<tr><td>1号</td><td>伪永高</td><td>重塑能刷出的最高身高，最热门的需求身高，穿搭基本不翻车</td></tr>' +
    '<tr><td>2~7号</td><td>中等身高</td><td>百搭区间，酷感风 / 温柔风穿搭都适配</td></tr>' +
    '<tr><td>8~13号</td><td>小个子</td><td>自带软萌感，搭配矮人面具、兔子头等可爱感拉满</td></tr>' +
    '<tr><td>14号</td><td>永矮</td><td>全游戏最矮，仅创号极小概率产出，重塑刷不出</td></tr>' +
    '</table>' +
    '<div class="height-tips">💡 游戏内部数值越小代表身高越高。最高 / 最矮身高是账号固定属性，正常不会变；当前身高只有使用「体型重塑魔法」才会永久改变（在最高~最矮之间随机）；矮人面具是临时再压2档，摘下即恢复，不改变原生身高。矮人面具 + 14号永矮 = 全游戏最矮视觉效果。</div>' +
    '</div>';

  content.innerHTML = html;

  // 好友码输入：自动加横杠格式化，并持久化保存
  var codeInput = content.querySelector('#height-code');
  if (codeInput) {
    codeInput.addEventListener('input', function() {
      var digits = this.value.replace(/\D/g, '').slice(0, 8);
      this.value = digits.length > 4 ? digits.slice(0, 4) + '-' + digits.slice(4) : digits;
      heightCode = this.value;
      saveHeightData();
    });
  }
}

/* ===== 档案编辑弹窗 ===== */
function heightNumOptions(sel) {
  var o = '<option value="">未知 / 未测</option>';
  for (var n = 0; n <= 14; n++) {
    o += '<option value="' + n + '"' + (String(n) === String(sel) ? ' selected' : '') + '>' + n + '号 · ' + heightTagLabel(n) + '</option>';
  }
  return o;
}

function openHeightModal(idx) {
  var isNew = !(idx >= 0);
  var r = isNew
    ? { name: '', code: heightCode, date: new Date().toISOString().slice(0, 10), cur: '', max: '', min: '', note: '' }
    : heightRecords[idx];
  var modal = document.getElementById('modal');
  modal.innerHTML =
    '<h3>' + (isNew ? '📏 新建身高档案' : '✏️ 编辑身高档案') + '</h3>' +
    '<div class="field"><label>备注名</label>' +
    '<input type="text" id="hr-name" value="' + escapeHtml(r.name) + '" placeholder="如：大号 / 小号 / 某某" autofocus></div>' +
    '<div class="field"><label>好友码（选填）</label>' +
    '<input type="text" id="hr-code" value="' + escapeHtml(r.code || '') + '" placeholder="XXXX-XXXX" maxlength="9" inputmode="numeric">' +
    '<div class="modal-hint">游戏内 设置 → 好友 → 使用编号</div></div>' +
    '<div class="field"><label>查询日期</label>' +
    '<input type="date" id="hr-date" value="' + escapeHtml(r.date || '') + '"></div>' +
    '<div class="field"><label>当前身高</label><select id="hr-cur">' + heightNumOptions(r.cur) + '</select></div>' +
    '<div class="field"><label>最高身高（永高上限）</label><select id="hr-max">' + heightNumOptions(r.max) + '</select>' +
    '<div class="modal-hint">账号固定属性，号数越小代表越高</div></div>' +
    '<div class="field"><label>最矮身高（永矮下限）</label><select id="hr-min">' + heightNumOptions(r.min) + '</select></div>' +
    '<div class="field"><label>备注（选填）</label>' +
    '<input type="text" id="hr-note" value="' + escapeHtml(r.note || '') + '" placeholder="如：重塑出1号了 / 差2个重塑"></div>' +
    '<div class="modal-actions">' +
    '<button class="btn btn-outline" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" onclick="confirmHeightRecord(' + (isNew ? -1 : idx) + ')">' + (isNew ? '确认添加' : '保存修改') + '</button>' +
    '</div>';
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(function() {
    var input = document.getElementById('hr-name');
    if (input) {
      input.focus();
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') confirmHeightRecord(isNew ? -1 : idx);
      });
    }
  }, 50);
}

function confirmHeightRecord(idx) {
  var name = document.getElementById('hr-name').value.trim();
  if (!name) { showToast('请输入备注名'); return; }
  var rec = {
    name: name,
    code: document.getElementById('hr-code').value.trim(),
    date: document.getElementById('hr-date').value,
    cur: document.getElementById('hr-cur').value,
    max: document.getElementById('hr-max').value,
    min: document.getElementById('hr-min').value,
    note: document.getElementById('hr-note').value.trim()
  };
  if (rec.code) heightCode = rec.code;
  if (idx >= 0) heightRecords[idx] = rec;
  else heightRecords.unshift(rec);
  saveHeightData();
  closeModal();
  render();
  showToast(idx >= 0 ? '档案已更新' : '档案已保存');
}

function deleteHeightRecord(idx) {
  var r = heightRecords[idx];
  if (!r) return;
  showConfirmModal('删除身高档案', '确定要删除「' + escapeHtml(r.name) + '」的身高档案吗？此操作不可撤销。', function() {
    heightRecords.splice(idx, 1);
    saveHeightData();
    render();
    showToast('已删除');
  });
}

/* ===== 导出 / 导入 ===== */
function exportData() {
  var data = JSON.stringify({ records: heightRecords, code: heightCode }, null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '身高档案备份-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('已导出备份文件');
}

function importData() {
  document.getElementById('import-file').click();
}

document.getElementById('import-file').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function() {
    try {
      var d = JSON.parse(reader.result);
      if (!Array.isArray(d.records)) throw new Error('格式不对');
      heightRecords = d.records;
      if (typeof d.code === 'string') heightCode = d.code;
      saveHeightData();
      render();
      showToast('导入成功：' + heightRecords.length + ' 条档案');
    } catch(err) {
      showToast('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ===== 通用弹窗 ===== */
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function showConfirmModal(title, message, onOk) {
  var modal = document.getElementById('modal');
  modal.innerHTML =
    '<h3>' + title + '</h3>' +
    '<p style="color:var(--text-light);line-height:1.6;margin-bottom:8px">' + message + '</p>' +
    '<div class="modal-actions">' +
    '<button class="btn btn-outline" onclick="closeModal()">取消</button>' +
    '<button class="btn btn-primary" id="confirm-ok" style="background:var(--danger)">确定</button>' +
    '</div>';
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('confirm-ok').onclick = function() {
    closeModal();
    onOk();
  };
}

/* ===== 初始化 ===== */
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});
loadHeightData();
render();
</script>
</body>
</html>
